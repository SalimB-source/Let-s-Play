<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#05060f" />
    <!--
      Thème clair / sombre — posé avant le premier rendu.
      Sans ce script, la page s'affiche en sombre puis bascule en clair une fois
      React monté : un flash très visible. La valeur doit rester synchronisée
      avec `src/theme/ThemeContext.jsx` (clé `lp-theme`, défaut `dark`).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lp-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f7f8fc');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
