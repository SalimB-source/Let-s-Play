<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="26%" r="84%">
      <stop offset="0" stop-color="#5e1220"/>
      <stop offset="1" stop-color="#180509"/>
    </radialGradient>
    <linearGradient id="gold" x1="20" y1="12" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6cf"/>
      <stop offset=".45" stop-color="#ffd75e"/>
      <stop offset="1" stop-color="#c8891f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffb545" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#ff6e66" stroke-width="2" stroke-opacity=".8"/>
  <rect x="5" y="5" width="54" height="54" rx="11" stroke="#ffc9c4" stroke-opacity=".2"/>
  <circle cx="32" cy="32" r="22" stroke="#ff8a80" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity=".45"/>
  <!-- Halo d'or et traînée : la Triforce fonce -->
  <circle cx="32" cy="32" r="21" fill="url(#halo)"/>
  <path d="M10 44 L18 36 M12 52 L22 44" stroke="#ffe9a8" stroke-width="2" stroke-linecap="round" stroke-opacity=".5"/>
  <!-- Triforce : deux triangles vers le haut, un vers le bas -->
  <g fill="url(#gold)" stroke="#5c3a08" stroke-width="1.6" stroke-linejoin="round">
    <path d="M25 14 L34 28 H16 Z"/>
    <path d="M39 14 L48 28 H30 Z"/>
    <path d="M16 32 H48 L32 54 Z"/>
  </g>
  <path d="M25 16 L33 27 H18" stroke="#fff8dc" stroke-width="1.4" stroke-opacity=".55" stroke-linejoin="round"/>
  <path d="M39 16 L47 27 H32" stroke="#fff8dc" stroke-width="1.4" stroke-opacity=".55" stroke-linejoin="round"/>
  <path d="M20 34 H44 L32 51" stroke="#fff8dc" stroke-width="1.4" stroke-opacity=".45" stroke-linejoin="round"/>
  <!-- Éclats d'impact -->
  <path d="M32 6 L32 10 M8 20 L12 22 M56 20 L52 22" stroke="#ffe9a8" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".7"/>
</svg>
