<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="pistol-bg" cx="50%" cy="35%" r="72%">
      <stop offset="0%" stop-color="#661824" />
      <stop offset="60%" stop-color="#2e0a10" />
      <stop offset="100%" stop-color="#160407" />
    </radialGradient>
    <linearGradient id="pistol-steel" x1="16" y1="16" x2="48" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#cfd8e3" />
      <stop offset="78%" stop-color="#6e7b8b" />
      <stop offset="100%" stop-color="#434d59" />
    </linearGradient>
    <linearGradient id="pistol-grip" x1="12" y1="32" x2="28" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e3894f" />
      <stop offset="50%" stop-color="#9e471e" />
      <stop offset="100%" stop-color="#59220b" />
    </linearGradient>
    <linearGradient id="pistol-flash" x1="44" y1="10" x2="58" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#ffe169" />
      <stop offset="100%" stop-color="#ff4b4b" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#pistol-bg)" stroke="#ff6e66" stroke-width="2" stroke-opacity="0.68" />
  <rect x="5" y="5" width="54" height="54" rx="11" stroke="#ffa8a3" stroke-width="1" stroke-opacity="0.22" />
  <!-- Target crosshair ring in backdrop -->
  <circle cx="34" cy="30" r="19" stroke="#ff6e66" stroke-width="1.1" stroke-dasharray="3 3" stroke-opacity="0.38" />
  <!-- Muzzle blast star at top-right -->
  <path d="M51 11L53.2 16.2L58.5 15.5L54.8 19.8L57.8 24.2L52.4 23.2L49.5 27.5L48.8 22.1L44 20.2L48.8 17.5L51 11Z" fill="url(#pistol-flash)" stroke="#2b070a" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Western Six-Shooter Revolver tilted at -22 deg -->
  <g transform="translate(30 34) rotate(-22) translate(-30 -34)">
    <!-- Trigger guard -->
    <path d="M23 36C23 41.2 28.8 42.2 30.5 37.5" stroke="#f2c15a" stroke-width="2.2" stroke-linecap="round" />
    <path d="M26.5 35.5C26.2 37.6 25.2 38.8 24.2 39.2" stroke="#cfd8e3" stroke-width="1.8" stroke-linecap="round" />
    <!-- Hammer spur -->
    <path d="M18 25.5L13.5 22.5L15.2 27.8Z" fill="url(#pistol-steel)" stroke="#1a080b" stroke-width="1.6" stroke-linejoin="round" />
    <!-- Main barrel & frame -->
    <path d="M17 26.5H47.5C48.6 26.5 49.5 27.4 49.5 28.5V31.2C49.5 32.1 48.8 32.8 47.9 32.8H33.5L30.5 36.8H21.5L17 33V26.5Z" fill="url(#pistol-steel)" stroke="#1a080b" stroke-width="2" stroke-linejoin="round" />
    <!-- Front sight & under-barrel ejector rod -->
    <path d="M45.5 26.5L47.5 23.8L48.8 26.5Z" fill="#cfd8e3" stroke="#1a080b" stroke-width="1.3" stroke-linejoin="round" />
    <rect x="33" y="32.2" width="13.5" height="2.6" rx="1.2" fill="#7d8a99" stroke="#1a080b" stroke-width="1.3" />
    <!-- Barrel specular highlight -->
    <path d="M19 28.4H46.5" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.8" />
    <!-- Revolving 6-chamber cylinder -->
    <rect x="21.5" y="26.2" width="11.2" height="8.6" rx="2" fill="url(#pistol-steel)" stroke="#1a080b" stroke-width="1.8" />
    <rect x="23.4" y="27.8" width="3.2" height="2.1" rx="1" fill="#2c3540" />
    <rect x="27.6" y="27.8" width="3.2" height="2.1" rx="1" fill="#2c3540" />
    <rect x="23.4" y="31.1" width="3.2" height="2.1" rx="1" fill="#2c3540" />
    <rect x="27.6" y="31.1" width="3.2" height="2.1" rx="1" fill="#2c3540" />
    <!-- Walnut grip with gold diamond inlay -->
    <path d="M17.5 32.2L23.8 34.8L19.8 49.5C19.2 51.4 17.2 52.4 15.2 51.8L11.8 50.6C10.1 50 9.4 48.1 10.2 46.4L17.5 32.2Z" fill="url(#pistol-grip)" stroke="#1a080b" stroke-width="2" stroke-linejoin="round" />
    <path d="M16.8 40L18.8 42.5L16.8 45L14.8 42.5L16.8 40Z" fill="#ffd56b" stroke="#3b1406" stroke-width="1" />
  </g>
</svg>
