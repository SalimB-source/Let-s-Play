<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Trophée mirage-score-3000">
  <defs>
    <linearGradient id="mirage-score-3000-metal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.45" stop-color="#ffd619"/>
      <stop offset="1" stop-color="#a9761a"/>
    </linearGradient>
    <linearGradient id="mirage-score-3000-face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6b3418"/>
      <stop offset="0.55" stop-color="#2a1246"/>
      <stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <radialGradient id="mirage-score-3000-glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirage-score-3000-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mirage-score-3000-clip"><circle cx="128" cy="128" r="102"/></clipPath>
  </defs>

  <!-- Anneau de métal : c'est lui qui porte le grade du trophée. -->
  <circle cx="128" cy="128" r="122" fill="url(#mirage-score-3000-metal)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- Cadran aux couleurs du jeu, halo derrière l'emblème. -->
  <circle cx="128" cy="128" r="102" fill="url(#mirage-score-3000-face)"/>
  <circle cx="128" cy="128" r="102" fill="url(#mirage-score-3000-glow)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#ffe0b0" stroke-width="3" opacity=".55"/>

  <g clip-path="url(#mirage-score-3000-clip)">
    <!-- Emblème du trophée (boîte 64 × 64 agrandie et centrée). -->
    <g transform="translate(128 128) scale(2.05) translate(-32 -32)" color="#fff4e0">
      <g transform="translate(1.6 2.4)" opacity=".35" color="#000000">
    <polygon points="32.0,4.0 35.4,12.4 44.4,13.0 37.4,18.8 39.6,27.5 32.0,22.7 24.4,27.5 26.6,18.8 19.6,13.0 28.6,12.4" fill="currentColor"/>
    <path d="M14 34l18-9 18 9" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 46l18-9 18 9" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <path d="M14 58l18-9 18 9" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/></g>
      <g>
    <polygon points="32.0,4.0 35.4,12.4 44.4,13.0 37.4,18.8 39.6,27.5 32.0,22.7 24.4,27.5 26.6,18.8 19.6,13.0 28.6,12.4" fill="currentColor"/>
    <path d="M14 34l18-9 18 9" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 46l18-9 18 9" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <path d="M14 58l18-9 18 9" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/></g>
    </g>
    <!-- Verre : reflet en haut, ombre portée en bas. -->
    <ellipse cx="128" cy="66" rx="96" ry="58" fill="url(#mirage-score-3000-gloss)"/>
    <ellipse cx="128" cy="216" rx="104" ry="52" fill="#000000" opacity=".22"/>
  </g>
</svg>
