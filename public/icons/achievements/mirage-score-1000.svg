<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Trophée mirage-score-1000">
  <defs>
    <linearGradient id="mirage-score-1000-metal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3ccd8"/>
      <stop offset="1" stop-color="#79838f"/>
    </linearGradient>
    <linearGradient id="mirage-score-1000-face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6b3418"/>
      <stop offset="0.55" stop-color="#2a1246"/>
      <stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <radialGradient id="mirage-score-1000-glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirage-score-1000-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mirage-score-1000-clip"><circle cx="128" cy="128" r="102"/></clipPath>
  </defs>

  <!-- Anneau de métal : c'est lui qui porte le grade du trophée. -->
  <circle cx="128" cy="128" r="122" fill="url(#mirage-score-1000-metal)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- Cadran aux couleurs du jeu, halo derrière l'emblème. -->
  <circle cx="128" cy="128" r="102" fill="url(#mirage-score-1000-face)"/>
  <circle cx="128" cy="128" r="102" fill="url(#mirage-score-1000-glow)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#ffe0b0" stroke-width="3" opacity=".55"/>

  <g clip-path="url(#mirage-score-1000-clip)">
    <!-- Emblème du trophée (boîte 64 × 64 agrandie et centrée). -->
    <g transform="translate(128 128) scale(2.05) translate(-32 -32)" color="#fff4e0">
      <g transform="translate(1.6 2.4)" opacity=".35" color="#000000">
    <polygon points="32.0,9.0 37.4,22.5 52.0,23.5 40.8,32.9 44.3,47.0 32.0,39.2 19.7,47.0 23.2,32.9 12.0,23.5 26.6,22.5" fill="currentColor"/>
    <path d="M9 12l2.6 6.4L18 21l-6.4 2.6L9 30l-2.6-6.4L0 21l6.4-2.6z" transform="translate(3 0)" fill="currentColor" opacity=".85"/>
    <path d="M52 40l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z" fill="currentColor" opacity=".85"/></g>
      <g>
    <polygon points="32.0,9.0 37.4,22.5 52.0,23.5 40.8,32.9 44.3,47.0 32.0,39.2 19.7,47.0 23.2,32.9 12.0,23.5 26.6,22.5" fill="currentColor"/>
    <path d="M9 12l2.6 6.4L18 21l-6.4 2.6L9 30l-2.6-6.4L0 21l6.4-2.6z" transform="translate(3 0)" fill="currentColor" opacity=".85"/>
    <path d="M52 40l2.2 5.4 5.4 2.2-5.4 2.2-2.2 5.4-2.2-5.4-5.4-2.2 5.4-2.2z" fill="currentColor" opacity=".85"/></g>
    </g>
    <!-- Verre : reflet en haut, ombre portée en bas. -->
    <ellipse cx="128" cy="66" rx="96" ry="58" fill="url(#mirage-score-1000-gloss)"/>
    <ellipse cx="128" cy="216" rx="104" ry="52" fill="#000000" opacity=".22"/>
  </g>
</svg>
