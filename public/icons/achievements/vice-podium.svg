<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Trophée vice-podium">
  <defs>
    <linearGradient id="vice-podium-metal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3ccd8"/>
      <stop offset="1" stop-color="#79838f"/>
    </linearGradient>
    <linearGradient id="vice-podium-face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5c1152"/>
      <stop offset="0.55" stop-color="#2a1152"/>
      <stop offset="1" stop-color="#0b0f2c"/>
    </linearGradient>
    <radialGradient id="vice-podium-glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff5db8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5db8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vice-podium-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="vice-podium-clip"><circle cx="128" cy="128" r="102"/></clipPath>
  </defs>

  <!-- Anneau de métal : c'est lui qui porte le grade du trophée. -->
  <circle cx="128" cy="128" r="122" fill="url(#vice-podium-metal)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- Cadran aux couleurs du jeu, halo derrière l'emblème. -->
  <circle cx="128" cy="128" r="102" fill="url(#vice-podium-face)"/>
  <circle cx="128" cy="128" r="102" fill="url(#vice-podium-glow)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#8ef7e6" stroke-width="3" opacity=".55"/>

  <g clip-path="url(#vice-podium-clip)">
    <!-- Emblème du trophée (boîte 64 × 64 agrandie et centrée). -->
    <g transform="translate(128 128) scale(2.05) translate(-32 -32)" color="#fff1fb">
      <g transform="translate(1.6 2.4)" opacity=".35" color="#000000">
    <rect x="10" y="8" width="6" height="50" rx="3" fill="currentColor"/>
    <rect x="16" y="10" width="40" height="28" fill="currentColor" opacity=".25"/>
    <g fill="currentColor">
      <rect x="16" y="10" width="10" height="9"/><rect x="36" y="10" width="10" height="9"/>
      <rect x="26" y="19" width="10" height="9"/><rect x="46" y="19" width="10" height="9"/>
      <rect x="16" y="28" width="10" height="10"/><rect x="36" y="28" width="10" height="10"/>
      <rect x="26" y="10" width="10" height="9" opacity=".55"/><rect x="46" y="10" width="10" height="9" opacity=".55"/>
      <rect x="16" y="19" width="10" height="9" opacity=".55"/><rect x="36" y="19" width="10" height="9" opacity=".55"/>
      <rect x="26" y="28" width="10" height="10" opacity=".55"/><rect x="46" y="28" width="10" height="10" opacity=".55"/>
    </g></g>
      <g>
    <rect x="10" y="8" width="6" height="50" rx="3" fill="currentColor"/>
    <rect x="16" y="10" width="40" height="28" fill="currentColor" opacity=".25"/>
    <g fill="currentColor">
      <rect x="16" y="10" width="10" height="9"/><rect x="36" y="10" width="10" height="9"/>
      <rect x="26" y="19" width="10" height="9"/><rect x="46" y="19" width="10" height="9"/>
      <rect x="16" y="28" width="10" height="10"/><rect x="36" y="28" width="10" height="10"/>
      <rect x="26" y="10" width="10" height="9" opacity=".55"/><rect x="46" y="10" width="10" height="9" opacity=".55"/>
      <rect x="16" y="19" width="10" height="9" opacity=".55"/><rect x="36" y="19" width="10" height="9" opacity=".55"/>
      <rect x="26" y="28" width="10" height="10" opacity=".55"/><rect x="46" y="28" width="10" height="10" opacity=".55"/>
    </g></g>
    </g>
    <!-- Verre : reflet en haut, ombre portée en bas. -->
    <ellipse cx="128" cy="66" rx="96" ry="58" fill="url(#vice-podium-gloss)"/>
    <ellipse cx="128" cy="216" rx="104" ry="52" fill="#000000" opacity=".22"/>
  </g>
</svg>
