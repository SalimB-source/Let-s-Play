<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Trophée mirage-crystal-hands">
  <defs>
    <linearGradient id="mirage-crystal-hands-metal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3ccd8"/>
      <stop offset="1" stop-color="#79838f"/>
    </linearGradient>
    <linearGradient id="mirage-crystal-hands-face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#6b3418"/>
      <stop offset="0.55" stop-color="#2a1246"/>
      <stop offset="1" stop-color="#120a26"/>
    </linearGradient>
    <radialGradient id="mirage-crystal-hands-glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirage-crystal-hands-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mirage-crystal-hands-clip"><circle cx="128" cy="128" r="102"/></clipPath>
  </defs>

  <!-- Anneau de métal : c'est lui qui porte le grade du trophée. -->
  <circle cx="128" cy="128" r="122" fill="url(#mirage-crystal-hands-metal)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- Cadran aux couleurs du jeu, halo derrière l'emblème. -->
  <circle cx="128" cy="128" r="102" fill="url(#mirage-crystal-hands-face)"/>
  <circle cx="128" cy="128" r="102" fill="url(#mirage-crystal-hands-glow)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#ffe0b0" stroke-width="3" opacity=".55"/>

  <g clip-path="url(#mirage-crystal-hands-clip)">
    <!-- Emblème du trophée (boîte 64 × 64 agrandie et centrée). -->
    <g transform="translate(128 128) scale(2.05) translate(-32 -32)" color="#fff4e0">
      <g transform="translate(1.6 2.4)" opacity=".35" color="#000000">
    <path d="M32 5l10 15-10 39L22 20z" fill="currentColor"/>
    <path d="M13 21l7 10-7 22-7-22z" fill="currentColor" opacity=".8"/>
    <path d="M51 21l7 10-7 22-7-22z" fill="currentColor" opacity=".8"/></g>
      <g>
    <path d="M32 5l10 15-10 39L22 20z" fill="currentColor"/>
    <path d="M13 21l7 10-7 22-7-22z" fill="currentColor" opacity=".8"/>
    <path d="M51 21l7 10-7 22-7-22z" fill="currentColor" opacity=".8"/></g>
    </g>
    <!-- Verre : reflet en haut, ombre portée en bas. -->
    <ellipse cx="128" cy="66" rx="96" ry="58" fill="url(#mirage-crystal-hands-gloss)"/>
    <ellipse cx="128" cy="216" rx="104" ry="52" fill="#000000" opacity=".22"/>
  </g>
</svg>
