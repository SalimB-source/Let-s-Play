<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Trophée vice-grand-slam">
  <defs>
    <linearGradient id="vice-grand-slam-metal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f2feff"/>
      <stop offset="0.45" stop-color="#aee6ff"/>
      <stop offset="1" stop-color="#5f92ad"/>
    </linearGradient>
    <linearGradient id="vice-grand-slam-face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5c1152"/>
      <stop offset="0.55" stop-color="#2a1152"/>
      <stop offset="1" stop-color="#0b0f2c"/>
    </linearGradient>
    <radialGradient id="vice-grand-slam-glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff5db8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5db8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vice-grand-slam-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="vice-grand-slam-clip"><circle cx="128" cy="128" r="102"/></clipPath>
  </defs>

  <!-- Anneau de métal : c'est lui qui porte le grade du trophée. -->
  <circle cx="128" cy="128" r="122" fill="url(#vice-grand-slam-metal)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- Cadran aux couleurs du jeu, halo derrière l'emblème. -->
  <circle cx="128" cy="128" r="102" fill="url(#vice-grand-slam-face)"/>
  <circle cx="128" cy="128" r="102" fill="url(#vice-grand-slam-glow)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#8ef7e6" stroke-width="3" opacity=".55"/>

  <g clip-path="url(#vice-grand-slam-clip)">
    <!-- Emblème du trophée (boîte 64 × 64 agrandie et centrée). -->
    <g transform="translate(128 128) scale(2.05) translate(-32 -32)" color="#fff1fb">
      <g transform="translate(1.6 2.4)" opacity=".35" color="#000000">
    <path d="M20 54A24 24 0 0 1 14 20" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 54a24 24 0 0 0 6-34" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 26l-7-3 5 8zM14 38l-8 1 6 6zM50 26l7-3-5 8zM50 38l8 1-6 6z" fill="currentColor"/>
    <polygon points="32.0,15.0 35.9,24.7 46.3,25.4 38.3,32.0 40.8,42.1 32.0,36.6 23.2,42.1 25.7,32.0 17.7,25.4 28.1,24.7" fill="currentColor"/></g>
      <g>
    <path d="M20 54A24 24 0 0 1 14 20" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 54a24 24 0 0 0 6-34" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 26l-7-3 5 8zM14 38l-8 1 6 6zM50 26l7-3-5 8zM50 38l8 1-6 6z" fill="currentColor"/>
    <polygon points="32.0,15.0 35.9,24.7 46.3,25.4 38.3,32.0 40.8,42.1 32.0,36.6 23.2,42.1 25.7,32.0 17.7,25.4 28.1,24.7" fill="currentColor"/></g>
    </g>
    <!-- Verre : reflet en haut, ombre portée en bas. -->
    <ellipse cx="128" cy="66" rx="96" ry="58" fill="url(#vice-grand-slam-gloss)"/>
    <ellipse cx="128" cy="216" rx="104" ry="52" fill="#000000" opacity=".22"/>
  </g>
</svg>
