<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Trophée vice-tournament-title">
  <defs>
    <linearGradient id="vice-tournament-title-metal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c3ccd8"/>
      <stop offset="1" stop-color="#79838f"/>
    </linearGradient>
    <linearGradient id="vice-tournament-title-face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5c1152"/>
      <stop offset="0.55" stop-color="#2a1152"/>
      <stop offset="1" stop-color="#0b0f2c"/>
    </linearGradient>
    <radialGradient id="vice-tournament-title-glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff5db8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5db8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vice-tournament-title-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="vice-tournament-title-clip"><circle cx="128" cy="128" r="102"/></clipPath>
  </defs>

  <!-- Anneau de métal : c'est lui qui porte le grade du trophée. -->
  <circle cx="128" cy="128" r="122" fill="url(#vice-tournament-title-metal)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- Cadran aux couleurs du jeu, halo derrière l'emblème. -->
  <circle cx="128" cy="128" r="102" fill="url(#vice-tournament-title-face)"/>
  <circle cx="128" cy="128" r="102" fill="url(#vice-tournament-title-glow)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#8ef7e6" stroke-width="3" opacity=".55"/>

  <g clip-path="url(#vice-tournament-title-clip)">
    <!-- Emblème du trophée (boîte 64 × 64 agrandie et centrée) : la coupe du champion. -->
    <g transform="translate(128 128) scale(2.05) translate(-32 -32)" color="#ffe9a8">
      <g transform="translate(1.6 2.4)" opacity=".35" color="#000000">
    <path d="M22 12h20v10c0 8-4 14-10 14s-10-6-10-14z" fill="currentColor"/>
    <path d="M22 14c-6 0-8 4-8 8 0 5 4 8 9 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M42 14c6 0 8 4 8 8 0 5-4 8-9 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="29" y="36" width="6" height="9" fill="currentColor"/>
    <rect x="22" y="45" width="20" height="6" rx="2.5" fill="currentColor"/>
    <polygon points="32,17 33.2,20.4 36.8,20.5 33.9,22.6 34.9,26 32,24 29.1,26 30.1,22.6 27.2,20.5 30.8,20.4" fill="#2a1152"/></g>
      <g>
    <path d="M22 12h20v10c0 8-4 14-10 14s-10-6-10-14z" fill="currentColor"/>
    <path d="M22 14c-6 0-8 4-8 8 0 5 4 8 9 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M42 14c6 0 8 4 8 8 0 5-4 8-9 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="29" y="36" width="6" height="9" fill="currentColor"/>
    <rect x="22" y="45" width="20" height="6" rx="2.5" fill="currentColor"/>
    <polygon points="32,17 33.2,20.4 36.8,20.5 33.9,22.6 34.9,26 32,24 29.1,26 30.1,22.6 27.2,20.5 30.8,20.4" fill="#2a1152"/></g>
    </g>
    <!-- Verre : reflet en haut, ombre portée en bas. -->
    <ellipse cx="128" cy="66" rx="96" ry="58" fill="url(#vice-tournament-title-gloss)"/>
    <ellipse cx="128" cy="216" rx="104" ry="52" fill="#000000" opacity=".22"/>
  </g>
</svg>
