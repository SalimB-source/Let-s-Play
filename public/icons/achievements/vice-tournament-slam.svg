<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Trophée vice-tournament-slam">
  <defs>
    <linearGradient id="vice-tournament-slam-metal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f2feff"/>
      <stop offset="0.45" stop-color="#aee6ff"/>
      <stop offset="1" stop-color="#5f92ad"/>
    </linearGradient>
    <linearGradient id="vice-tournament-slam-face" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5c1152"/>
      <stop offset="0.55" stop-color="#2a1152"/>
      <stop offset="1" stop-color="#0b0f2c"/>
    </linearGradient>
    <radialGradient id="vice-tournament-slam-glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff5db8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5db8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vice-tournament-slam-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="vice-tournament-slam-clip"><circle cx="128" cy="128" r="102"/></clipPath>
    <!-- Étoile des quatre titres, centrée sur son point d'ancrage. -->
    <polygon id="vice-tournament-slam-star" points="0,-2.2 0.5,-0.7 2.1,-0.7 0.9,0.3 1.3,1.8 0,0.9 -1.3,1.8 -0.9,0.3 -2.1,-0.7 -0.5,-0.7"/>
  </defs>

  <!-- Anneau de métal : c'est lui qui porte le grade du trophée. -->
  <circle cx="128" cy="128" r="122" fill="url(#vice-tournament-slam-metal)"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3"/>
  <circle cx="128" cy="128" r="113" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
  <circle cx="128" cy="128" r="112" fill="none" stroke="rgba(0,0,0,.28)" stroke-width="6" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- Cadran aux couleurs du jeu, halo derrière l'emblème. -->
  <circle cx="128" cy="128" r="102" fill="url(#vice-tournament-slam-face)"/>
  <circle cx="128" cy="128" r="102" fill="url(#vice-tournament-slam-glow)"/>
  <circle cx="128" cy="128" r="102" fill="none" stroke="#8ef7e6" stroke-width="3" opacity=".55"/>

  <g clip-path="url(#vice-tournament-slam-clip)">
    <!-- Emblème du trophée (boîte 64 × 64 agrandie et centrée) : la coupe sous ses quatre étoiles. -->
    <g transform="translate(128 128) scale(2.05) translate(-32 -32)" color="#ffe9a8">
      <g transform="translate(1.6 2.4)" opacity=".35" color="#000000">
    <use href="#vice-tournament-slam-star" x="13" y="8" fill="currentColor"/>
    <use href="#vice-tournament-slam-star" x="26" y="8" fill="currentColor"/>
    <use href="#vice-tournament-slam-star" x="38" y="8" fill="currentColor"/>
    <use href="#vice-tournament-slam-star" x="51" y="8" fill="currentColor"/>
    <path d="M22 16h20v10c0 8-4 14-10 14s-10-6-10-14z" fill="currentColor"/>
    <path d="M22 18c-6 0-8 4-8 8 0 5 4 8 9 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M42 18c6 0 8 4 8 8 0 5-4 8-9 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="29" y="40" width="6" height="9" fill="currentColor"/>
    <rect x="22" y="49" width="20" height="6" rx="2.5" fill="currentColor"/></g>
      <g>
    <use href="#vice-tournament-slam-star" x="13" y="8" fill="currentColor"/>
    <use href="#vice-tournament-slam-star" x="26" y="8" fill="currentColor"/>
    <use href="#vice-tournament-slam-star" x="38" y="8" fill="currentColor"/>
    <use href="#vice-tournament-slam-star" x="51" y="8" fill="currentColor"/>
    <path d="M22 16h20v10c0 8-4 14-10 14s-10-6-10-14z" fill="currentColor"/>
    <path d="M22 18c-6 0-8 4-8 8 0 5 4 8 9 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M42 18c6 0 8 4 8 8 0 5-4 8-9 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="29" y="40" width="6" height="9" fill="currentColor"/>
    <rect x="22" y="49" width="20" height="6" rx="2.5" fill="currentColor"/></g>
    </g>
    <!-- Verre : reflet en haut, ombre portée en bas. -->
    <ellipse cx="128" cy="66" rx="96" ry="58" fill="url(#vice-tournament-slam-gloss)"/>
    <ellipse cx="128" cy="216" rx="104" ry="52" fill="#000000" opacity=".22"/>
  </g>
</svg>
