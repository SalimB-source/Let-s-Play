name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Les commits créés avec GITHUB_TOKEN ne déclenchent pas l’événement push.
  # Le robot appelle donc ce workflow avec le SHA qu’il vient de publier.
  workflow_call:
    inputs:
      ref:
        description: 'Commit à construire et déployer'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Vite embeds these at build time (see vite.config.js). Declare them as
    # repository variables (Settings → Secrets and variables → Actions →
    # Variables) so the Pages build gets real Supabase auth; without them the
    # site still deploys, but /auth stays in demo-preview mode. Repository
    # variables are enough (unlike secrets) because both values are public:
    # they already ship inside the client bundle.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Supabase configuration
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning title=Supabase non configuré::Ce build part sans clés Supabase : /auth restera en mode démo. Ajoutez les variables de dépôt VITE_SUPABASE_URL et VITE_SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions → Variables), puis relancez le déploiement."
          else
            echo "Supabase configuré pour ce build : $VITE_SUPABASE_URL"
          fi
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
