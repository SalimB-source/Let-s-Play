# Construit l'installeur Windows du Sablier de Bab El (coque PC, desktop/).
#
# Deux jobs :
#   - `verifs`     : les 20 vérifications de la coque (GPU, serveur local,
#                    isolation) sur Linux — rapides, et bloquantes ;
#   - `installeur` : sur windows-latest, paquet web élagué + electron-builder →
#                    `le-sablier-de-bab-el-<version>-setup.exe` et `-portable.exe`.
#
# Publication, comme pour l'APK (android-apk.yml) :
#   - artefacts de run (rétention 90 jours) ;
#   - GitHub Release sur le tag « desktop », remplacée à chaque build de main :
#     lien de téléchargement permanent pour les joueurs.
#
# Contrairement à l'APK, l'exécutable N'EST PAS committé sur la branche :
# ~180 Mo par build saturerait le dépôt. Le téléchargement passe par la Release.
#
# Lancement manuel : onglet Actions → « Installeur PC (Windows) » → Run workflow.

name: Installeur PC (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'desktop/**'
      - 'scripts/desktop-bundle.mjs'
      - 'scripts/desktop-check.mjs'
      - 'vite.config.js'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: write

concurrency:
  group: desktop-windows
  cancel-in-progress: true

jobs:
  verifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vérifications de la coque
        run: npm run check:desktop

  installeur:
    needs: verifs
    runs-on: windows-latest
    # Mêmes valeurs publiques que le déploiement web (voir deploy.yml) : sans
    # elles l'installeur se construit quand même, mais le compte et les duels
    # en ligne y resteront indisponibles (jeu hors ligne intact).
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances du site
        run: npm ci

      - name: Dépendances de la coque (Electron, electron-builder)
        run: npm --prefix desktop install

      - name: Paquet web élagué
        run: npm run desktop:web

      - name: Taille du paquet
        shell: bash
        run: du -sh desktop/dist-web || true

      - name: Installeur + version portable
        run: npm run desktop:dist

      - name: Artefacts de run
        uses: actions/upload-artifact@v4
        with:
          name: sablier-pc-windows
          path: |
            desktop/release/*.exe
          retention-days: 90
          if-no-files-found: error

      # Release permanente sur le tag « desktop » (main seulement) : le lien de
      # téléchargement des joueurs ne change jamais, le contenu est remplacé.
      - name: Publier la GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd desktop/release
          FICHIERS=$(ls *.exe)
          VERSION=$(node -p "require('../../desktop/package.json').version")
          {
            echo "Version PC installable du Sablier de Bab El, le jeu de cartes de Let's Play."
            echo ""
            echo "**Installation** : télécharge \`le-sablier-de-bab-el-${VERSION}-setup.exe\`, lance-le,"
            echo "puis ouvre le jeu depuis le menu Démarrer ou le raccourci du bureau."
            echo "Le paquet sans installation (\`-portable.exe\`) se lance d'un double-clic, sans rien écrire ailleurs."
            echo ""
            echo "**Carte graphique** : le rendu 3D passe par la carte du PC (WebGL → ANGLE/D3D11)."
            echo "Menu « Carte graphique → État de la carte graphique… » pour vérifier quel GPU travaille."
            echo ""
            echo "- **Version** : ${VERSION}"
            echo "- **Commit** : ${GITHUB_SHA::7}"
          } > notes.md
          gh release delete desktop --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/desktop 2>/dev/null || true
          gh release create desktop $FICHIERS --title "Le Sablier de Bab El pour PC — v${VERSION}" --notes-file notes.md
          echo "Release publiée : $FICHIERS"
