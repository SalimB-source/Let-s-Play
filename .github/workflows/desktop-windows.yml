# Construit l'installeur Windows du Sablier de Bab El (coque PC, desktop/).
#
# Trois jobs :
#   - `verifs`          : les vérifications de la coque (GPU, serveur local,
#                         isolation) sur Linux — rapides, et bloquantes ;
#   - `installeur`      : sur windows-latest, **coque seule** + electron-builder
#                         → `le-sablier-de-bab-el-<version>-setup.exe` (~80 Mo) ;
#   - `pack-hors-ligne` : sur demande seulement, construit le site élagué et le
#                         publie en `.zip` à part (~100 Mo), pour qui veut jouer
#                         sans Internet.
#
# **L'installeur ne contient plus le site.** La fenêtre charge le site en ligne
# (`let-s-play-nu.vercel.app`), donc un correctif du jeu arrive au lancement
# suivant — sans reconstruire 230 Mo d'exécutable, et sans que les 394 peintures
# de cartes repassent dans un runner Windows. D'où les déclencheurs ci-dessous :
# seuls les changements de la **coque** reconstruisent l'installeur.
#
# Le numéro de version reste dérivé du dépôt (étape « Version dérivée du
# build ») : chaque build publié porte un numéro plus grand que le précédent,
# donc `electron-updater` le voit et le propose au lancement.
#
# Publication, comme pour l'APK (android-apk.yml) :
#   - artefacts de run (rétention 30 jours) ;
#   - GitHub Release sur le tag « desktop », remplacée à chaque build de main :
#     lien de téléchargement permanent et métadonnées latest.yml/.blockmap pour
#     electron-updater.
#
# Contrairement à l'APK, l'exécutable N'EST PAS committé sur la branche : le
# téléchargement passe par la Release.
#
# Lancement manuel : onglet Actions → « Installeur PC (Windows) » → Run workflow.
# Cochez `pack_hors_ligne` pour republier aussi le pack hors ligne.

name: Installeur PC (Windows)

on:
  workflow_dispatch:
    inputs:
      pack_hors_ligne:
        description: 'Construire aussi le pack hors ligne (.zip, ~100 Mo)'
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      # La coque, et elle seule : le site est chargé en ligne, un correctif de
      # `src/`, `public/` ou `index.html` n'a donc rien à reconstruire ici.
      - 'desktop/**'
      - 'scripts/desktop-bundle.mjs'
      - 'scripts/desktop-check.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/desktop-bundle.mjs'
      - 'scripts/desktop-check.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-windows.yml'

permissions:
  contents: write
  # Le step « Rapport de tailles en PR » commente la pull request.
  pull-requests: write

concurrency:
  group: desktop-windows
  # Une PR peut annuler son propre build ; un build de `main` ne doit jamais
  # être coupé en pleine publication (l'étape Release supprime le tag `desktop`
  # avant de le recréer : une annulation au mauvais moment laisserait le lien de
  # téléchargement cassé). Les builds de `main` font donc la queue.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vérifications de la coque
        run: npm run check:desktop

  installeur:
    needs: verifs
    runs-on: windows-latest
    # Mêmes valeurs publiques que le déploiement web (voir deploy.yml) : sans
    # elles l'installeur se construit quand même, mais le compte et les duels
    # en ligne y resteront indisponibles (jeu hors ligne intact). La site key
    # Turnstile alimente le widget anti-robot de l'écran de connexion PC — sans
    # elle, ce dernier reste bloqué sur captchaNotConfigured.
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # L'étape « Version dérivée du build » compte les commits du dépôt :
          # un clone superficiel renverrait 1 et casserait la numérotation.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # La version est celle du fichier (majeure.mineure) et son correctif suit
      # le dépôt : le plus grand entre le nombre de commits, le numéro de run
      # et le correctif déjà écrit. Strictement croissante, donc vue par
      # `electron-updater` — et une montée manuelle en 1.1.0 garde la priorité.
      - name: Version dérivée du build
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(node -p "require('./desktop/package.json').version")
          MAJEUR=${BASE%%.*}
          RESTE=${BASE#*.}
          MINEUR=${RESTE%%.*}
          CORRECTIF=${RESTE#*.}
          COMMITS=$(git rev-list --count HEAD)
          RUN=${GITHUB_RUN_NUMBER:-0}
          VERSION=$(node -e '
            const [majeur, mineur, base, commits, run] = process.argv.slice(1).map(Number);
            console.log(`${majeur}.${mineur}.${Math.max(base, commits, run)}`);
          ' "$MAJEUR" "$MINEUR" "$CORRECTIF" "$COMMITS" "$RUN")
          node -e '
            const fs = require("node:fs");
            const p = "desktop/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(p, `${JSON.stringify(pkg, null, 2)}\n`);
          ' "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "::notice title=Version du build::v$VERSION (fichier : v$BASE · commits : $COMMITS · run : $RUN)"

      - name: Dépendances du site
        run: npm ci

      - name: Dépendances de la coque (Electron, electron-builder)
        run: npm --prefix desktop install

      - name: Coque seule (sans paquet web)
        shell: bash
        run: |
          set -o pipefail
          # Aucun build Vite ici : l'installeur ne contient pas le site. Le
          # script assemble `desktop/pack` et pose un `LISEZ-MOI.txt` là où
          # `extraResources` attend un dossier — la coque, elle, n'y verra pas
          # d'`index.html` et démarrera donc sur le site en ligne.
          npm run desktop:coque 2>&1 | tee bundle.log

      # Les logs de run ne sont pas toujours consultables : en cas d'échec, les
      # lignes utiles sont recopiées en annotations de check-run (lisibles via
      # l'API, et affichées sur l'onglet Checks de la PR).
      - name: Diagnostic paquet (échec)
        if: failure()
        shell: bash
        run: |
          # Le log complet en base64 dans une annotation : ni cadres dessinés,
          # ni ANSI, ni retours chariot ne peuvent casser le transport, et
          # l'annotation se relit via l'API GitHub.
          echo "::error::LOG64 $(base64 -w0 bundle.log | head -c 20000)"
          exit 1

      - name: Taille du paquet
        shell: bash
        run: |
          # Coque seule : quelques octets. Un `index.html` ici voudrait dire que
          # le site a été embarqué par erreur.
          du -sh desktop/dist-web || true
          if [ -s desktop/dist-web/index.html ]; then
            echo "::error title=Paquet web embarqué::desktop/dist-web contient un index.html — l’installeur « en ligne » doit sortir sans le site."
            exit 1
          fi

      - name: Installeur + version portable
        shell: bash
        run: |
          set -o pipefail
          npm run desktop:dist 2>&1 | tee builder.log

      - name: Diagnostic installeur (échec)
        if: failure()
        shell: bash
        run: |
          grep -nE "error|Error|ERROR|ERR_|failed|Failed|cannot|Cannot" builder.log | head -40 | while IFS= read -r l; do
            echo "::error::${l:0:400}"
          done
          exit 1

      - name: Vérifier les métadonnées electron-updater
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          test -s "desktop/release/le-sablier-de-bab-el-${VERSION}-setup.exe.blockmap"
          test -s desktop/release/latest.yml
          node --input-type=module -e "import fs from 'node:fs'; const v=process.argv[1], y=fs.readFileSync('desktop/release/latest.yml','utf8'); if(!y.includes('version: ' + v) || !y.includes('le-sablier-de-bab-el-' + v + '-setup.exe')) throw new Error('latest.yml ne référence pas l\u2019installeur v' + v); console.log('latest.yml prêt pour v' + v);" "$VERSION"

      - name: Contenu de release/ (tailles réelles)
        shell: bash
        run: |
          mo() { echo "::notice::$1 = $(( $(du -sk "$2" | cut -f1) / 1024 )) Mo"; }
          mo "dist-web (paquet jeu)" desktop/dist-web
          mo "win-unpacked (app dépliée)" desktop/release/win-unpacked
          mo "resources/app (jeu)" desktop/release/win-unpacked/resources/app
          mo "resources/app.asar" desktop/release/win-unpacked/resources/app.asar
          for d in desktop/release/win-unpacked/*; do mo "win-unpacked/$(basename "$d")" "$d"; done
          for f in desktop/release/*.exe; do
            echo "::notice::$(basename "$f") = $(( $(stat -c%s "$f") / 1048576 )) Mo"
          done

      # Les annotations de step sont plafonnées à 10 : le rapport complet des
      # tailles part en commentaire de la pull request, lisible via l'API.
      - name: Rapport de tailles en PR
        # Utile sur la PR qui touche la coque ; un build de `main` n'a pas de PR
        # (le rapport part alors dans le log du run).
        if: github.event_name == 'pull_request'
        # Un échec de commentaire ne doit jamais priver le run de ses artefacts.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo "Rapport de build du $(date -u '+%F %T UTC') — commit \`${GITHUB_SHA::7}\`"
            echo
            echo '```'
            du -sh desktop/dist-web desktop/release/win-unpacked 2>/dev/null
            echo '-- win-unpacked (1er niveau) --'
            du -sh desktop/release/win-unpacked/* 2>/dev/null | sort -h
            echo '-- resources --'
            du -sh desktop/release/win-unpacked/resources/* 2>/dev/null | sort -h
            echo '-- app.asar (contenu) --'
            du -sh desktop/release/win-unpacked/resources/app/* 2>/dev/null | sort -h | tail -6
            echo '-- installeurs --'
            ls -la desktop/release/*.exe
            echo '-- asar.unpacked (plus gros entrants) --'
            du -sh desktop/release/win-unpacked/resources/app.asar.unpacked/* 2>/dev/null | sort -h | tail -8
            echo '-- liste asar (30 premières entrées) --'
            node -e "try{const a=require('@electron/asar');console.log(a.listPackage('desktop/release/win-unpacked/resources/app.asar',{recursive:false}).join('\n'))}catch(e){console.log('asar illisible : '+e.message)}" 2>/dev/null || true
            echo '-- config effective --'
            cat desktop/release/builder-effective-config.yaml 2>/dev/null || cat desktop/release/builder-debug.yml 2>/dev/null || ls desktop/release
            echo '-- scène --'
            ls -la desktop/stage 2>/dev/null || echo 'stage ABSENT'
            echo '```'
          } > report.md
          # Le numéro vient de l'événement `pull_request` ; à défaut, on cherche
          # la PR par sa tête (un checkout détaché ne permet pas `gh pr view`).
          NUM=${PR_NUM:-}
          if [ -z "$NUM" ]; then
            NUM=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY:$GITHUB_REF_NAME&state=open" -q '.[0].number' 2>/dev/null || true)
          fi
          if [ -n "$NUM" ]; then
            gh pr comment "$NUM" --body-file report.md
          else
            echo "Pas de PR ouverte pour cette branche : rapport non commenté."
            cat report.md
          fi

      - name: Artefacts de run
        uses: actions/upload-artifact@v4
        with:
          name: sablier-pc-windows
          path: |
            desktop/release/le-sablier-de-bab-el-*-setup.exe
            desktop/release/le-sablier-de-bab-el-*-setup.exe.blockmap
            desktop/release/le-sablier-de-bab-el-*-portable.exe
            desktop/release/latest.yml
          retention-days: 30
          if-no-files-found: error

      # Release permanente sur le tag « desktop » (main seulement) : le lien de
      # téléchargement des joueurs ne change jamais, le contenu est remplacé.
      - name: Publier la GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd desktop/release
          VERSION=$(node -p "require('../../desktop/package.json').version")
          # Copies au nom FIXE : l'écran d'entrée du site (/jeu/sablier-de-bab-el)
          # pointe vers …/download/desktop/le-sablier-de-bab-el-setup.exe, un lien
          # qui doit survivre aux changements de version. Les noms versionnés
          # restent publiés à côté, pour archiver.
          cp "le-sablier-de-bab-el-${VERSION}-setup.exe" le-sablier-de-bab-el-setup.exe
          cp "le-sablier-de-bab-el-${VERSION}-portable.exe" le-sablier-de-bab-el-portable.exe
          FICHIERS=$(ls *.exe *.blockmap latest*.yml)
          {
            echo "Version PC installable du Sablier de Bab El, le jeu de cartes de Let's Play."
            echo ""
            echo "**Installation** : télécharge \`le-sablier-de-bab-el-${VERSION}-setup.exe\`, lance-le,"
            echo "puis ouvre le jeu depuis le menu Démarrer ou le raccourci du bureau."
            echo "Le paquet sans installation (\`-portable.exe\`) se lance d'un double-clic, sans rien écrire ailleurs."
            echo ""
            echo "**Carte graphique** : le rendu 3D passe par la carte du PC (WebGL → ANGLE/D3D11)."
            echo "Menu « Carte graphique → État de la carte graphique… » pour vérifier quel GPU travaille."
            echo ""
            echo "**Hors connexion (option)** : cet installeur ouvre le site en ligne, il ne l'embarque pas."
            echo "Pour jouer sans Internet, télécharge le **pack hors ligne** ci-dessous, puis installe-le"
            echo "depuis le menu « Aide → Pack hors ligne… → Choisir un fichier .zip… ». Le jeu démarre"
            echo "toujours sur le site (correctifs du jour) et bascule sur le pack quand le réseau manque."
            echo ""
            echo "**Mises à jour** : l'installeur Windows vérifie cette Release au démarrage."
            echo "Le portable reste à mettre à jour en téléchargeant son nouvel exécutable."
            echo ""
            echo "- **Version** : ${VERSION}"
            echo "- **Commit** : ${GITHUB_SHA::7}"
          } > notes.md
          gh release delete desktop --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/desktop 2>/dev/null || true
          gh release create desktop $FICHIERS --title "Le Sablier de Bab El pour PC — v${VERSION}" --notes-file notes.md
          echo "Release publiée : $FICHIERS"

  # ---------------------------------------------------------------------------
  # Pack hors ligne — sur demande seulement
  # ---------------------------------------------------------------------------
  # Ce que l'installeur ne contient plus : le site élagué, pour jouer sans
  # Internet. Il est publié à part, sous un nom FIXE, à côté de l'installeur :
  # le joueur le télécharge une fois et l'installe par le menu
  # « Aide → Pack hors ligne… ». Il n'est pas reconstruit à chaque main — c'est
  # précisément ce que la coque en ligne rend inutile — mais quand on le
  # reconstruit, il part avec la Release du moment.
  pack-hors-ligne:
    needs: installeur
    if: github.event_name == 'workflow_dispatch' && inputs.pack_hors_ligne == true
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances du site
        run: npm ci

      - name: Paquet web élagué
        shell: bash
        run: |
          set -o pipefail
          # Sans clés Supabase le pack se construit quand même : le jeu hors
          # ligne fonctionne, seul le compte (donc la progression serveur) manque.
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning title=Pack hors ligne sans Supabase::VITE_SUPABASE_URL et/ou VITE_SUPABASE_PUBLISHABLE_KEY absentes : le jeu hors ligne fonctionne, mais la connexion au compte restera indisponible dans ce pack."
          fi
          npm run desktop:web 2>&1 | tee bundle.log

      - name: Diagnostic paquet (échec)
        if: failure()
        shell: bash
        run: |
          echo "::error::LOG64 $(base64 -w0 bundle.log | head -c 20000)"
          exit 1

      # Le .zip contient un dossier `app/` à sa racine : c'est le nom que la
      # coque attend dans `resources/app`, et celui que `main.js` décompresse.
      - name: Archive du pack
        shell: pwsh
        run: |
          $dest = 'desktop/pack-hors-ligne'
          Remove-Item -Recurse -Force $dest -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item 'desktop/dist-web' "$dest/app" -Recurse
          Remove-Item 'desktop/sablier-pack-hors-ligne.zip' -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$dest/app" -DestinationPath 'desktop/sablier-pack-hors-ligne.zip' -Force
          $octets = (Get-Item 'desktop/sablier-pack-hors-ligne.zip').Length
          Write-Output "pack hors ligne : $([math]::Round($octets / 1MB)) Mo"

      - name: Artefact de run
        uses: actions/upload-artifact@v4
        with:
          name: sablier-pack-hors-ligne
          path: desktop/sablier-pack-hors-ligne.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publier le pack sur la Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `--clobber` : le nom du fichier ne change pas, le contenu oui.
          gh release upload desktop desktop/sablier-pack-hors-ligne.zip --clobber
          echo "Pack hors ligne publié sur la Release « desktop »."
