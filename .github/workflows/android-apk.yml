# Compile et signe l'APK Android de Let's Play à chaque modification du
# dossier android/, puis la publie :
#   - en artefact téléchargeable (« lets-play-apk ») ;
#   - en GitHub Release sur le tag « apk » (lien permanent pour les utilisateurs).
#
# Lancement manuel : onglet Actions → « APK Android » → Run workflow.
# L'APK signée utilise la clé committée dans android/keystore/ ; si tu bascules
# un jour vers les secrets GitHub (ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD),
# ils prennent automatiquement le dessus (voir android/app/build.gradle).

name: APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    # **Trois APK** depuis une seule coque : le site entier (l'historique), plus
    # une application dédiée par jeu, qui n'en sort pas (voir `MainActivity`,
    # constantes `ROUTE_JEU`/`APP_ID` remplacées par `build.gradle`).
    strategy:
      fail-fast: false
      matrix:
        include:
          - jeu: site
            fichier: lets-play
            release: apk
            titre: "Let's Play — le site"
            appId: dz.letsplay.officiel
          - jeu: sablier
            fichier: le-sablier-de-bab-el
            release: apk-sablier
            titre: "Le Sablier de Bab El — APK"
            appId: dz.letsplay.sablier
          - jeu: vice-city
            fichier: vice-city-rush
            release: apk-vice-city
            titre: "Vice City Rush — APK"
            appId: dz.letsplay.vicecity
    env:
      ANDROID_JEU: ${{ matrix.jeu }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Le numéro de version Android est dérivé du nombre de commits :
          # sans clone complet, il reculerait et les mises à jour refuseraient
          # de s'installer par-dessus une APK déjà présente.
          fetch-depth: 0

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: SDK Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # Optionnel : si les secrets GitHub sont configurés, ils remplacent la
      # clé committée (recommandé si le repo s'ouvre à des contributeurs).
      - name: Restaurer la clé depuis les secrets (si présents)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$GITHUB_WORKSPACE/letsplay-release.p12"
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/letsplay-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=letsplay" >> "$GITHUB_ENV"
            echo "→ clé chargée depuis les secrets GitHub."
          else
            echo "→ secrets absents : signature avec la clé committée (android/keystore)."
          fi

      # ── Numéro de version dérivé du dépôt ─────────────────────────────────
      # Même principe que l'installeur PC : `versionCode` ne recule jamais et
      # change à chaque build, sinon Android refuse la mise à jour par-dessus
      # l'APK déjà installée (« Application non installée »).
      #   versionCode = max(plancher du fichier, nombre de commits)
      #   versionName = 1.0.<versionCode>
      - name: Version dérivée du build
        run: |
          set -euo pipefail
          PLANCHER=$(grep -oE "versionCodeEnv\.toInteger\(\) : [0-9]+" android/app/build.gradle | grep -oE "[0-9]+$")
          COMMITS=$(git rev-list --count HEAD)
          CODE=$(( PLANCHER > COMMITS ? PLANCHER : COMMITS ))
          echo "ANDROID_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=1.0.$CODE" >> "$GITHUB_ENV"
          echo "→ versionCode $CODE, versionName 1.0.$CODE (plancher $PLANCHER, $COMMITS commits)"

      - name: Icônes des jeux
        run: |
          # Les mipmap des jeux dédiés sont relues depuis les PNG maîtres du PC.
          # Régénérer ici garantit qu'ils correspondent au dessin du moment.
          node scripts/android-icons.mjs

      - name: Construire l'APK signée
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # En cas d'échec : publie les lignes utiles du log en annotations
      # (lisibles via l'API check-runs, contrairement aux logs complets).
      - name: Diagnostic (échec)
        if: failure()
        run: |
          grep -E "FAILURE|What went wrong|Caused by|error:|Error:|FAILED|Exception" build.log | head -30 | while IFS= read -r l; do
            echo "::error::${l:0:400}"
          done

      # L'identité de l'APK est décidée par deux jetons remplacés à la
      # compilation : une erreur de sélection donnerait une APK qui s'installe
      # par-dessus la mauvaise application, ou qui ouvre le site entier au lieu
      # du jeu. On relit donc l'APK produite, pas le code.
      - name: Vérifier l'identité de l'APK
        run: |
          APK="android/app/build/outputs/apk/release/${{ matrix.fichier }}-release.apk"
          test -s "$APK" || { echo "::error::APK absente : $APK"; exit 1; }
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -E "^package:|^application-label" || true
          echo "$BADGING" | grep -q "package: name='${{ matrix.appId }}'" \
            || { echo "::error::applicationId inattendu (attendu ${{ matrix.appId }})"; exit 1; }
          # La route du jeu doit être inscrite dans le bytecode : c'est la preuve
          # que le jeton __ROUTE_JEU__ a bien été remplacé par le bundle.
          if [ "${{ matrix.jeu }}" != "site" ]; then
            case "${{ matrix.jeu }}" in
              sablier)   ROUTE="/jeu/sablier-de-bab-el" ;;
              vice-city) ROUTE="/jeu/vice-city-rush" ;;
            esac
            unzip -p "$APK" 'classes*.dex' | strings | grep -qF "$ROUTE" \
              || { echo "::error::la route $ROUTE est absente de l'APK"; exit 1; }
            echo "Route verrouillée présente : $ROUTE"
          fi
          echo "Identité vérifiée : ${{ matrix.appId }}"

      - name: Renommer l'APK avec la version
        run: |
          cp "android/app/build/outputs/apk/release/${{ matrix.fichier }}-release.apk" \
             "${{ matrix.fichier }}-v${ANDROID_VERSION_NAME}.apk"
          ls -la ${{ matrix.fichier }}-v*.apk

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fichier }}-apk
          path: ${{ matrix.fichier }}-v*.apk
          retention-days: 90
          if-no-files-found: error

      # Publie l'APK en release GitHub (tag « apk », remplacé à chaque build) :
      # lien de téléchargement permanent et direct pour les utilisateurs.
      - name: Publier l'APK en GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls ${{ matrix.fichier }}-v*.apk)
          {
            echo "Build automatique de la coque Android du site."
            echo ""
            echo "**Installation** : télécharge l'APK sur ton téléphone, ouvre-le, et autorise l'installation depuis des sources inconnues si demandé."
            echo ""
            echo "**Mises à jour du site** : automatiques dans l'app — pas besoin de réinstaller l'APK pour voir les nouvelles actus."
            echo ""
            echo "- **Version** : \`$APK\` (versionCode $ANDROID_VERSION_CODE)"
            echo "- **Commit** : \`${GITHUB_SHA::7}\`"
            echo ""
            echo "**Si l'écran reste noir** : l'application utilise le moteur d'affichage du téléphone"
            echo "(\`Android System WebView\`). Mettez-le à jour dans le Play Store, ainsi que Chrome."
            echo "La page de secours de l'application affiche la version du moteur et le message d'erreur."
          } > notes.md
          # Copie au nom FIXE, à côté du nom versionné : les pages du site
          # pointent vers …/releases/download/<tag>/<fichier>-latest.apk, un lien
          # qui doit survivre aux changements de version. Le nom versionné reste
          # publié pour l'archive (et pour qui veut une version précise).
          LATEST="${{ matrix.fichier }}-latest.apk"
          cp "$APK" "$LATEST"
          gh release delete "${{ matrix.release }}" --yes --cleanup-tag 2>/dev/null || true
          git push origin ":refs/tags/${{ matrix.release }}" 2>/dev/null || true
          gh release create "${{ matrix.release }}" "$APK" "$LATEST" \
            --title "${{ matrix.titre }} — $APK" --notes-file notes.md
          echo "Release publiée : ${{ matrix.release }} ($APK + $LATEST)"

      # Dépose aussi l'APK sur la branche (android/dist/lets-play-latest.apk)
      # via l'API Contents : pratique pour la récupérer en clonant le repo.
      # (Les commits faits avec GITHUB_TOKEN ne déclenchent pas de workflows.)
      # Seule l'APK du site est déposée sur la branche (chemin historique). Les
      # deux APK de jeu vivent sur leur Release, comme les installeurs PC.
      - name: Déposer l'APK sur la branche
        if: matrix.jeu == 'site'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            APK=$(ls lets-play-v*.apk)
            base64 -w0 "$APK" > content.b64
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/android/dist/lets-play-latest.apk?ref=$GITHUB_REF_NAME" -q .sha 2>/dev/null || echo "")
            if [ -n "$SHA" ]; then
              jq -n --rawfile content content.b64 --arg msg "Build APK : $APK [skip ci]" \
                    --arg branch "$GITHUB_REF_NAME" --arg sha "$SHA" \
                    '{message: $msg, content: $content, branch: $branch, sha: $sha}' > payload.json
            else
              jq -n --rawfile content content.b64 --arg msg "Build APK : $APK [skip ci]" \
                    --arg branch "$GITHUB_REF_NAME" \
                    '{message: $msg, content: $content, branch: $branch}' > payload.json
            fi
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/android/dist/lets-play-latest.apk" \
                 --input payload.json >/dev/null; then
              echo "APK déposée sur la branche (android/dist/lets-play-latest.apk)."
            else
              echo "::error::Échec du dépôt de l'APK sur la branche — voir le log du step."
            fi
            rm -f content.b64 payload.json
          } 2>&1 | tee deposit.log
          exit 0
