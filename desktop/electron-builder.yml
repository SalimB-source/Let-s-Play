# Empaquetage de la coque PC — desktop/electron-builder.yml
# ------------------------------------------------------------------
# `npm run desktop:dist` (depuis la racine ou depuis desktop/) lit ce fichier.
# Sortie : desktop/release/
#   - le-sablier-de-bab-el-<version>-setup.exe    (installeur NSIS, x64)
#   - le-sablier-de-bab-el-<version>-portable.exe (un seul fichier, sans install)
#
# Le **pack hors ligne** (desktop/dist-web) n'est PAS mis dans l'archive
# app.asar : `extraResources` le copie à côté, dans resources/app, où le serveur
# HTTP local le lit comme de simples fichiers — lire 100 Mo dans une archive à
# chaque requête serait plus lent et plus fragile.
#
# L'installeur publié part **sans** ce dossier : `npm run desktop:coque` y laisse
# seulement un `LISEZ-MOI.txt`, pour qu'`extraResources` ait une source (il refuse
# un chemin absent) et que la coque ne trouve pas d'`index.html` — elle démarre
# donc sur le site en ligne. `npm run desktop:web` le remplit pour le pack
# hors ligne, publié à part sur la même Release.

appId: dz.letsplay.sablier
productName: Le Sablier de Bab El

# electron-updater lit la métadonnée latest.yml et l'installateur (NSIS) sur la
# Release publique `desktop` du dépôt. Le workflow les publie avec les .blockmap.
publish:
  - provider: github
    owner: SalimB-source
    repo: Let-s-Play
    releaseType: release

# LZMA solide : sans cela l'installeur pèse ~640 Mo, les binaires Electron étant
# mal comprimés par le mode normal. Le build est plus lent, le téléchargement
# beaucoup plus court.
compression: maximum
copyright: Copyright © 2026 Let's Play — média algérien du jeu vidéo

# Ce fichier est COPIÉ dans desktop/pack/ par scripts/desktop-bundle.mjs, et
# electron-builder tourne avec `--project pack` : le projet d'empaquetage ne
# contient alors AUCUN node_modules, ce qui retire toute chance de voir l'asar
# gonfler (la CI a montré un app.asar.unpacked de 729 Mo quand le projet était
# desktop/ lui-même). Les chemins ci-dessous sont relatifs à pack/.
directories:
  output: ../release
  # Dossier hors des noms exclus des snapshots de l'environnement de dev
  # (« build » en fait partie) : les icônes vivent dans app-icons/.
  buildResources: app-icons

# Le binaire Electron vient du cache d'electron-builder (téléchargé une fois par
# runner) : la version exacte est lue dans pack/package.json par le bundle.

# pack/ ne contient que l'exécutable ; on exclut les outils de build eux-mêmes.
#
# **`node_modules` est exclu en bloc, puis rouvert module par module.** Sans
# cela, electron-builder collecte les dépendances de production en remontant
# l'arborescence (`appDir`, `projectDir`, racine du workspace) : selon le
# résultat de `npm list`, il a déjà embarqué le `node_modules` du dépôt entier —
# 672 Mo de `app.asar.unpacked` et un installeur de 497 Mo pour un jeu qui n'en
# a pas besoin. La liste ci-dessous est celle de `electron-updater` et de ses
# dépendances ; `scripts/desktop-bundle.mjs` **vérifie** qu'elle couvre tout
# `desktop/pack/node_modules` et échoue sinon, plutôt que de livrer un exécutable
# qui planterait au lancement sur un module manquant.
files:
  - '**/*'
  - '!node_modules/**'
  - 'node_modules/electron-updater/**'
  - 'node_modules/builder-util-runtime/**'
  - 'node_modules/argparse/**'
  - 'node_modules/debug/**'
  - 'node_modules/fs-extra/**'
  - 'node_modules/graceful-fs/**'
  - 'node_modules/js-yaml/**'
  - 'node_modules/jsonfile/**'
  - 'node_modules/lazy-val/**'
  - 'node_modules/lodash.escaperegexp/**'
  - 'node_modules/lodash.isequal/**'
  - 'node_modules/ms/**'
  - 'node_modules/sax/**'
  - 'node_modules/tiny-typed-emitter/**'
  - 'node_modules/universalify/**'
  - '!app-icons{,/**/*}'
  - '!electron-builder.yml'

# Le jeu lui-même, hors archive.
extraResources:
  - from: ../dist-web
    to: app
    filter:
      - '**/*'
  # Lues au lancement pour l'icône de la fenêtre et de la barre des tâches.
  - from: app-icons/icon.ico
    to: icon.ico
  - from: app-icons/icon.png
    to: icon.png

win:
  icon: app-icons/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Assistant classique (« suivant, suivant ») plutôt que l'install en un clic :
  # le joueur voit où le jeu s'installe et peut changer le dossier.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Le Sablier de Bab El
  installerIcon: app-icons/icon.ico
  uninstallerIcon: app-icons/icon.ico
  artifactName: le-sablier-de-bab-el-${version}-setup.${ext}

portable:
  artifactName: le-sablier-de-bab-el-${version}-portable.${ext}

linux:
  icon: app-icons/icon.png
  category: Game
  target:
    - AppImage
  artifactName: le-sablier-de-bab-el-${version}.${ext}

# macOS : nécessite un runner macOS et une icône .icns (à générer si besoin —
# `make-icon.mjs` produit le PNG source). La CI du dépôt ne construit que Windows.
mac:
  icon: app-icons/icon.png
  category: public.app-category.games
  target:
    - dmg
