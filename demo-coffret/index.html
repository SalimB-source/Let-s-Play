<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sablier — la cérémonie du coffret</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&family=Orbitron:wght@400..900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./bundle.css?v=1793048746" />
    <style>
      html, body { margin: 0; background: #05060f; color: #e8eaf6; }
      #racine { min-height: 100vh; }
      .barre-demo {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 400;
        display: flex;
        gap: 8px;
        align-items: center;
        font: 500 12px/1.2 'Rajdhani', 'Inter', system-ui, sans-serif;
      }
      .barre-demo button {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid rgba(232, 183, 92, 0.45);
        background: rgba(8, 9, 18, 0.8);
        color: #ffdf9e;
        font: 600 11px/1 'Orbitron', system-ui, sans-serif;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        cursor: pointer;
      }
      .barre-demo button:hover { border-color: #e8b75c; }
      .barre-demo span { color: #7f87a0; }
      .barre-demo span.is-ko { color: #ff9d9d; }
      .barre-demo span.is-ok { color: #9fe2b0; }
      /* Le bouton du jeu, réduit à sa plus simple expression pour la démo. */
      .rpg-btn {
        padding: 11px 22px;
        border-radius: 10px;
        border: 1px solid rgba(232, 183, 92, 0.5);
        background: linear-gradient(160deg, #241a0e, #12100c);
        color: #ffe9b8;
        font: 700 12px/1 'Orbitron', system-ui, sans-serif;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
      }
      .rpg-btn:hover { transform: translateY(-1px); border-color: #e8b75c; box-shadow: 0 10px 24px rgba(232, 183, 92, 0.22); }
      .rpg-btn--primary {
        color: #161005;
        background: linear-gradient(160deg, #f4d089, #d5a44f);
        border-color: rgba(255, 233, 184, 0.8);
        box-shadow: 0 12px 30px rgba(232, 183, 92, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="racine"></div>
    <pre id="erreur" hidden style="position:fixed;inset:auto 12px 60px 12px;z-index:500;margin:0;padding:12px;border-radius:10px;background:#3a1010;color:#ffd3d3;font:12px/1.5 monospace;white-space:pre-wrap"></pre>
    <div class="barre-demo">
      <button id="vue-coffret" type="button">Le coffret</button>
      <button id="vue-booster" type="button">Le booster</button>
      <button id="rejouer" type="button">Rejouer</button>
      <span id="build">build —</span>
      <span id="images">illustrations : —</span>
      <span>démo isolée · rien ne touche à votre progression</span>
    </div>
    <script>
      // Un écran vide ne doit jamais être muet : toute erreur s'affiche.
      window.addEventListener('error', function (e) {
        var boite = document.getElementById('erreur');
        if (!boite) return;
        boite.hidden = false;
        boite.textContent = 'Erreur : ' + (e.message || e.error || 'inconnue') + ' — ' + (e.filename || '');
      });
    </script>
    <script>
      // Compte les illustrations réellement peintes : 0/N = le fichier ne vient
      // pas, et l'URL en échec s'affiche sous le compteur.
      (function () {
        var boite = document.getElementById('images');
        var echecs = [];
        function compter() {
          var imgs = Array.prototype.slice.call(document.querySelectorAll('img'));
          var peintes = imgs.filter(function (i) { return i.complete && i.naturalWidth > 0; });
          boite.textContent = 'illustrations : ' + peintes.length + '/' + imgs.length
            + (echecs.length ? ' — échec ' + echecs[0] : '');
          boite.className = echecs.length ? 'is-ko' : (imgs.length && peintes.length === imgs.length ? 'is-ok' : '');
        }
        document.addEventListener('error', function (e) {
          var cible = e.target;
          if (cible && cible.tagName === 'IMG') { echecs.push(cible.getAttribute('src')); compter(); }
        }, true);
        var build = document.getElementById('build');
        if (build) build.textContent = 'build ' + (window.__BUILD__ || 'inconnu');
        setInterval(compter, 600);
        compter();
      })();
    </script>
    <script src="./bundle.js?v=1793048746"></script>
  </body>
</html>
