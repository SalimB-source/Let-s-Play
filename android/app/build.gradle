plugins {
    id 'com.android.application'
}

// ── Signature de l'APK ──────────────────────────────────────────────────────
// Deux sources possibles, la première gagne :
//   1. Variables d'environnement (recommandé, utilisé par GitHub Actions si
//      les secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD existent) ;
//   2. Repli committé : android/keystore/letsplay-release.p12 +
//      android/keystore/signing.properties (pratique pour builder en local).
// Sans aucune des deux, `assembleRelease` produit une APK non signée.
def keystorePath = System.getenv('ANDROID_KEYSTORE_FILE')
def keystorePass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keystoreAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'letsplay'
def fallbackPropsFile = rootProject.file('keystore/signing.properties')
def fallbackStoreFile = rootProject.file('keystore/letsplay-release.p12')
if (keystorePath == null && fallbackStoreFile.exists() && fallbackPropsFile.exists()) {
    def props = new Properties()
    fallbackPropsFile.withInputStream { props.load(it) }
    keystorePath = fallbackStoreFile.absolutePath
    keystorePass = props.getProperty('storePassword')
    keystoreAlias = props.getProperty('keyAlias') ?: 'letsplay'
}

// ── Numéro de version ───────────────────────────────────────────────────────
// Le correctif vient du dépôt, pas de ce fichier : la CI calcule
// `versionCode = max(ce fichier, nombre de commits)` et le passe en variable
// d'environnement (voir .github/workflows/android-apk.yml). Sans ça, une APK
// reconstruite gardait le même `versionCode` — Android refuse alors la mise à
// jour par-dessus l'ancienne (« Application non installée »), et le numéro
// affiché ne dit plus rien de ce que contient le fichier.
def versionCodeEnv = System.getenv('ANDROID_VERSION_CODE')
def versionNameEnv = System.getenv('ANDROID_VERSION_NAME')

// ── Identité de l'APK ───────────────────────────────────────────────────────
// Une seule coque Android, **trois applications** (mêmes jeux que côté PC, voir
// `desktop/jeux.js`). La CI choisit avec des variables d'environnement :
//
//   ANDROID_JEU=site       → « Let's Play »    (dz.letsplay.officiel)  le site entier
//   ANDROID_JEU=sablier    → « Le Sablier »    (dz.letsplay.sablier)   le jeu de cartes seul
//   ANDROID_JEU=vice-city  → « Vice City Rush »(dz.letsplay.vicecity)  la conduite seule
//
// Sans variable, on retrouve l'APK historique (le site entier) : un build local
// ne change donc pas de comportement par surprise.
def jeuDemande = (System.getenv('ANDROID_JEU') ?: 'site').trim().toLowerCase()
def identites = [
    'site'      : [nom: "Let's Play",        appId: 'dz.letsplay.officiel',  route: '',                      dossier: 'ic_launcher'],
    'sablier'   : [nom: 'Le Sablier de Bab El', appId: 'dz.letsplay.sablier', route: '/jeu/sablier-de-bab-el', dossier: 'ic_launcher_sablier'],
    'vice-city' : [nom: 'Vice City Rush',    appId: 'dz.letsplay.vicecity',  route: '/jeu/vice-city-rush',   dossier: 'ic_launcher_vice_city'],
]
if (!identites.containsKey(jeuDemande)) {
    throw new GradleException("ANDROID_JEU=\"${jeuDemande}\" est inconnu (valeurs : ${identites.keySet().join(', ')}).")
}
def identite = identites[jeuDemande]

android {
    namespace 'dz.letsplay.officiel'
    compileSdk 35

    defaultConfig {
        applicationId identite.appId
        // Le nom affiché et l'icône du lanceur sont posés ici plutôt que dans
        // les ressources : une seule coque, trois identités, sans dupliquer
        // strings.xml ni les dossiers mipmap.
        // L'apostrophe de « Let's Play » doit être échappée pour aapt, sinon le
        // build échoue sur « Invalid unicode escape sequence in string ».
        resValue 'string', 'app_name', identite.nom.replace("'", "\\'")
        manifestPlaceholders = [appIcon: '@mipmap/' + identite.dossier]
        minSdk 23          // Android 6.0+
        targetSdk 35
        // Plancher : la CI ne descend jamais en dessous. On l'incrémente à la
        // main seulement si un build hors CI doit passer au-dessus d'une APK
        // déjà installée.
        versionCode versionCodeEnv != null && versionCodeEnv.isInteger() ? versionCodeEnv.toInteger() : 6
        versionName versionNameEnv != null && !versionNameEnv.isEmpty() ? versionNameEnv : '1.0.5'
    }

    signingConfigs {
        release {
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword keystorePass
                keyAlias keystoreAlias
                keyPassword keystorePass
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        // Le contenu vit sur le site : rien à lint côté Android.
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // `MainActivity` est écrit **une fois**, avec des jetons dans ses constantes
    // (`"__ROUTE_JEU__"`, `"__APP_ID__"`). On ne le modifie pas sur place — ce
    // serait un fichier sale après chaque build — : une tâche le copie, avec ses
    // jetons remplacés, dans un dossier de sources que Gradle compile à la place
    // de `src/main/java`. L'APK produite ne contient donc plus aucun jeton, et
    // le dépôt reste propre.
    sourceSets {
        main {
            java.srcDirs = ["$buildDir/generated/java-jeu"]
        }
    }

    base {
        // Nom du fichier produit : `lets-play`, `le-sablier-de-bab-el`,
        // `vice-city-rush` — la CI le renomme ensuite avec la version.
        archivesName = identite.appId.split('\\.')[-1] == 'officiel' ? 'lets-play' : (jeuDemande == 'vice-city' ? 'vice-city-rush' : 'le-sablier-de-bab-el')
    }
}

// ── Génération de MainActivity pour ce jeu ──────────────────────────────────
// Recopie `android/app/src/main/java/` en remplaçant les deux jetons. Tout le
// reste de l'arborescence (une seule classe aujourd'hui) est copié tel quel.
def genererSourcesJeu = tasks.register('genererSourcesJeu', Copy) {
    from 'src/main/java'
    into "$buildDir/generated/java-jeu"
    filter { ligne -> ligne
        .replace('"__ROUTE_JEU__"', '"' + identite.route + '"')
        .replace('"__APP_ID__"', '"' + identite.appId + '"')
    }
    inputs.property('route', identite.route)
    inputs.property('appId', identite.appId)
}
tasks.configureEach { tache ->
    if (tache.name.startsWith('pre') && tache.name.endsWith('Build')
        || tache.name == 'compileDebugJavaWithJavac'
        || tache.name == 'compileReleaseJavaWithJavac') {
        tache.dependsOn(genererSourcesJeu)
    }
}

dependencies {
    // Tirer-rafraîchir dans l'app.
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
